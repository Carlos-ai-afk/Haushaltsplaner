<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aufgabenverteiler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Aufgabenverteiler (WB1-WB5)</h1>
      <button id="themeToggle" aria-label="Dark-Mode umschalten">🌙</button>
    </header>

    <main class="app-container">
      <section class="card">
        <h2>Neue Aufgabe erstellen</h2>
        <form id="taskForm" class="task-form">
          <label for="taskTitle">Aufgabe</label>
          <input
            id="taskTitle"
            name="taskTitle"
            type="text"
            placeholder="z. B. Daily-Report prüfen"
            required
          />

          <label for="taskDepartment">Abteilung</label>
          <select id="taskDepartment" name="taskDepartment" required>
            <option value="WB1">WB1</option>
            <option value="WB2">WB2</option>
            <option value="WB3">WB3</option>
            <option value="WB4">WB4</option>
            <option value="WB5">WB5</option>
          </select>

          <label for="taskAssignees">Kollegen (mehrere möglich)</label>
          <input
            id="taskAssignees"
            name="taskAssignees"
            type="text"
            placeholder="z. B. Alex, Mina, Sam"
            required
          />

          <button type="submit">Aufgabe hinzufügen</button>
        </form>
      </section>

      <section class="card">
        <h2>Offen</h2>
        <div id="openTasks" class="task-list"></div>
      </section>

      <section class="card">
        <h2>Erledigt</h2>
        <div id="doneTasks" class="task-list"></div>
      </section>
    </main>

    <footer class="app-footer">
      Für alle Geräte im Firmennetz nutzbar, wenn alle denselben Server-Link öffnen. Nach Reload sieht jeder den aktuellen Stand.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
